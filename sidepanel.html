<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redact Agent</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="./gemini.js"></script>
    <script src="./lib/tesseract.min.js"></script>
    <script src="./privacy/coordinateUtils.js"></script>
    <script src="./privacy/screenshotRedactor.js"></script>
    <script src="./privacy/patternAnalyzer.js"></script>
    <script src="./privacy/contextAnalyzer.js"></script>
    <script src="./privacy/ocrAnalyzer.js"></script>
    <script src="./privacy/detectionFusion.js"></script>
    <script src="./privacy/privacyEngine.js"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
