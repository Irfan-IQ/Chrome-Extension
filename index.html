<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Vision Model Basic Test</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;

        font-family:
          Arial,
          Helvetica,
          sans-serif;

        background: #f3f4f6;
        color: #111827;
      }

      main {
        width: min(1100px, 100%);
        margin: 0 auto;

        background: #ffffff;

        padding: 28px;

        border-radius: 14px;

        box-shadow:
          0 8px 30px
          rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0;

        font-size: 28px;
        font-weight: 700;
      }

      .subtitle {
        margin: 8px 0 0;

        color: #6b7280;
        font-size: 14px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;

        margin-top: 24px;
      }

      input[type="file"] {
        max-width: 100%;
      }

      button {
        padding: 10px 18px;

        border: 0;
        border-radius: 8px;

        background: #111827;
        color: #ffffff;

        font-size: 14px;

        cursor: pointer;
      }

      button:hover {
        background: #1f2937;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #status {
        margin: 16px 0;

        color: #4b5563;
        font-size: 14px;
      }

      .stats {
        display: grid;

        grid-template-columns:
          repeat(3, 1fr);

        gap: 12px;

        margin-bottom: 18px;
      }

      .stat {
        padding: 16px;

        background: #f9fafb;

        border:
          1px solid #e5e7eb;

        border-radius: 10px;
      }

      .stat-label {
        display: block;

        margin-bottom: 6px;

        color: #6b7280;

        font-size: 13px;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 700;
      }

      .viewer {
        overflow: auto;

        padding: 12px;

        background: #fafafa;

        border:
          1px solid #e5e7eb;

        border-radius: 10px;
      }

      #canvas {
        display: block;

        max-width: 100%;
        height: auto;

        border:
          1px solid #d1d5db;

        border-radius: 6px;
      }

      @media (max-width: 700px) {
        body {
          padding: 16px;
        }

        main {
          padding: 20px;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .controls {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Vision Model Basic Test</h1>

      <p class="subtitle">
        Visual object detection and redaction
      </p>

      <div class="controls">
        <input
          type="file"
          id="imageInput"
          accept="image/*"
        />

        <button id="runDetection">
          Run Detection
        </button>
      </div>

      <p id="status">
        Select an image to begin.
      </p>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">
            Objects Detected
          </span>

          <span
            class="stat-value"
            id="detectedCount"
          >
            0
          </span>
        </div>

        <div class="stat">
          <span class="stat-label">
            Redacted
          </span>

          <span
            class="stat-value"
            id="redactedCount"
          >
            0
          </span>
        </div>

        <div class="stat">
          <span class="stat-label">
            Warnings
          </span>

          <span
            class="stat-value"
            id="warningCount"
          >
            0
          </span>
        </div>
      </div>

      <div class="viewer">
        <canvas id="canvas"></canvas>
      </div>
    </main>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
